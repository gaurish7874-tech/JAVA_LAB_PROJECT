# CodeRev configuration
# Path of the SQLite database file (created on first run)
db.path=data/coderev.db

# Log file for java.util.logging output
log.file=logs/coderev.log
log.level=INFO

# Weights of the daily-recommendation priority score.
# priority = wc * confidenceNeed + wd * difficulty + wr * recencyDays + wf * revisionCount
weight.confidence=2.0
weight.difficulty=1.5
weight.recency=0.5
weight.frequency=0.3
